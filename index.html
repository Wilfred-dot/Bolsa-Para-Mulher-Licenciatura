#instalar{color:var(--ac);border-color:var(--ac);background:transparent}
:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
@media(min-width:760px){main{padding-left:92px}.dia{left:-86px}.num{font-size:7rem}}

.atual{display:flex;align-items:center;gap:12px;margin-top:6px;margin-bottom:0}
#atualizar{min-height:44px;padding:0 14px;background:var(--hero-tx);color:var(--hero);border:0;border-radius:3px;font-weight:600;cursor:pointer;flex:none}

 requisitos:["Cidadã de um país africano","Cumprir os requisitos de admissão da universidade","Necessidade socioeconómica e liderança"],idioma:"Inglês",idade:"Até 28 anos",so_mulheres:"Não",
 link:"https://mcfsprecruitment.ur.ac.rw/",fonte:"https://mcfsprecruitment.ur.ac.rw/",verificado:"2026-11-02",

]};
</script><script>const $=s=>document.querySelector(s);
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const cap=t=>t[0].toUpperCase()+t.slice(1);
const norm=t=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const HOJE=new Date();HOJE.setHours(0,0,0,0);
function ler(k){try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return{}}}
function gravar(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let BOLSAS=DADOS.bolsas,ATUAL=DADOS.atualizado;
let fav=ler("fav"),feita=ler("feita"),novas=ler("novas"),vistas=ler("vistas");
if(Object.keys(vistas).length)BOLSAS.forEach(b=>{if(!vistas[b.id])novas[b.id]=true});
BOLSAS.forEach(b=>vistas[b.id]=true);gravar("vistas",vistas);gravar("novas",novas);
const dataDe=b=>b.prazo?new Date(b.prazo+"T00:00:00"):null;
const dias=b=>Math.round((dataDe(b)-HOJE)/864e5);
const extenso=d=>d.getDate()+" de "+MESES[d.getMonth()]+" de "+d.getFullYear();
const ym=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const rotuloMes=k=>{const[a,m]=k.split("-");return cap(MESES[+m-1])+" "+a};
const ordemDe=b=>b.prazo||(b.quando&&b.quando.ordem)||"9999";
function chave(b){
 if(b.prazo)return dataDe(b)<HOJE?"fechada":b.prazo.slice(0,7);
 if(b.quando)return b.quando.ordem.slice(0,7);
 return"confirmar";
}
function haystack(b){const k=chave(b),m=/^\d/.test(k)?(()=>{const n=+k.split("-")[1];return MESES[n-1]+" "+MESES[n-1].slice(0,3)+" "+n+" "+k.slice(0,4)})():"";
 return norm([b.nome,b.pais,b.instituicao,b.cobertura,b.cobertura_detalhes,b.cursos,b.ciclo,b.idioma,b.requisitos.join(" "),b.notas,b.quando?b.quando.texto:"",m].join(" "))}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function marca(p,txt,termos){
 const n=norm(txt);let i=0;const idx=[];
 termos.forEach(t=>{let k=n.indexOf(t);while(t&&k>-1){idx.push([k,k+t.length]);k=n.indexOf(t,k+t.length)}});
 idx.sort((a,b)=>a[0]-b[0]);
 idx.forEach(([a,b])=>{if(a<i)return;p.append(txt.slice(i,a),el("mark",0,txt.slice(a,b)));i=b});
 p.append(txt.slice(i));
}
function cartao(b,termos){
 const d=dataDe(b),q=b.quando,tipo=d?"exato":q?q.tipo:"nenhum";
 const a=el("article",tipo==="exato"?"conf":tipo==="janela"?"jan":tipo==="previsto"?"prev":"");a.id=b.id;
 const dia=el("div","dia");
 if(d)dia.append(el("b",0,String(d.getDate())),el("i",0,MESES[d.getMonth()].slice(0,3)));
 else if(q)dia.append(el("b",0,MESES[+q.ordem.slice(5,7)-1].slice(0,3)),el("i",0,q.tipo));
 else dia.append(el("b",0,"?"),el("i",0,"sem data"));
 a.append(dia);
 const h=el("h3");marca(h,b.nome,termos);if(novas[b.id])h.append(" ",el("span","nova","Nova"));a.append(h);
 const l=el("p","linha");l.append(b.bandeira+" "+b.pais+", bolsa ",el("b",0,b.cobertura.toLowerCase()),", "+b.ciclo.toLowerCase().replace(/^(\d)/,"ano letivo $1"));a.append(l);
 let txt="Prazo a confirmar no site oficial",c="p-cz";
 if(d){const n=dias(b);txt=n<0?"Fechou a "+extenso(d):"Fecha a "+extenso(d)+", "+(n===0?"hoje":n===1?"falta 1 dia":"faltam "+n+" dias");c=n<0?"p-cz":n<=7?"p-vm":n<=21?"p-lar":"p-ver"}
 else if(q){txt=(q.tipo==="previsto"?"Previsto, não confirmado. ":"Janela publicada. ")+q.texto;c=q.tipo==="previsto"?"p-cz":"p-lar"}
 a.append(el("p","prazo "+c,txt));
 if(b.prazo_anterior)a.append(el("p","vazio","Ciclo anterior: "+b.prazo_anterior+"."));
 const det=el("dl","det");det.hidden=true;
 [["Cobertura",b.cobertura_detalhes],["Cursos",b.cursos],["Requisitos",b.requisitos.join("; ")],["Idioma",b.idioma],["Limite de idade",b.idade],["Só mulheres",b.so_mulheres],["Entidade",b.instituicao],["Notas",b.notas],["Verificado em",b.verificado]]
 .forEach(([k,v])=>{if(v)det.append(el("dt",0,k),el("dd",0,v))});
 const f=el("dd"),fa=el("a",0,"Página consultada");fa.href=b.fonte;fa.target="_blank";fa.rel="noopener noreferrer";f.append(fa);det.append(el("dt",0,"Fonte"),f);
 const ac=el("div","acoes");
 const o=el("a","prim","Abrir site oficial");o.href=b.link;o.target="_blank";o.rel="noopener noreferrer";
 const v=el("button",0,"Ver detalhes");v.type="button";v.setAttribute("aria-expanded","false");
 v.onclick=()=>{det.hidden=!det.hidden;v.setAttribute("aria-expanded",String(!det.hidden));v.textContent=det.hidden?"Ver detalhes":"Menos detalhes";if(novas[b.id]){delete novas[b.id];gravar("novas",novas);const n=h.querySelector(".nova");if(n)n.remove()}};
 const s=el("button",0,"Favorita");s.type="button";s.setAttribute("aria-pressed",!!fav[b.id]);
 s.onclick=()=>{fav[b.id]=!fav[b.id];gravar("fav",fav);s.setAttribute("aria-pressed",!!fav[b.id])};
 const k=el("button",0,"Já candidatei");k.type="button";k.setAttribute("aria-pressed",!!feita[b.id]);
 k.onclick=()=>{feita[b.id]=!feita[b.id];gravar("feita",feita);k.setAttribute("aria-pressed",!!feita[b.id]);resumo()};
 ac.append(o,v,s,k);a.append(ac,det);return a;
}
function meses(){const o=[];let a=HOJE.getFullYear(),m=HOJE.getMonth();while(a<2027||(a===2027&&m<=11)){o.push(a+"-"+String(m+1).padStart(2,"0"));if(++m>11){m=0;a++}}return o}
function resumo(){
 const ex=BOLSAS.filter(b=>b.prazo&&dias(b)>=0).length,pv=BOLSAS.filter(b=>b.quando&&b.quando.tipo==="previsto").length,n=BOLSAS.filter(b=>feita[b.id]).length;
 $("#meta").textContent=BOLSAS.length+" bolsas. "+ex+" com data confirmada. "+pv+" com data prevista. "+n+" já candidatadas.";
}
function destaque(){
 const h=$("#hero");h.textContent="";h.className="hero";
 const p=BOLSAS.filter(b=>b.prazo&&dias(b)>=0).sort((a,b)=>a.prazo.localeCompare(b.prazo))[0];
 h.append(el("p","rot",p?"Próximo prazo confirmado":"Sem prazo confirmado"));
 if(!p){h.append(el("p","hn","Vê as datas previstas por mês abaixo."));return}
 const d=dataDe(p),n=dias(p),g=el("div","gr"),t=el("div");
 t.append(el("span","mes",MESES[d.getMonth()]+" de "+d.getFullYear()),el("span","falta",n===0?"é hoje":n===1?"falta 1 dia":"faltam "+n+" dias"));
 g.append(el("span","num",String(d.getDate())),t);
 const a=el("a",0,"Ver esta bolsa");a.href="#"+p.id;
 h.append(g,el("p","hn",p.nome+", "+p.pais),a);
}
function desenhar(){
 const termos=norm($("#q").value).split(/\s+/).filter(Boolean),cob=norm($("#fCob").value),pais=$("#fPais").value,fv=$("#fFav").value;
 const r=BOLSAS.filter(b=>termos.every(t=>haystack(b).includes(t))&&(!cob||norm(b.cobertura).includes(cob))&&(!pais||b.pais===pais)&&
  (!fv||(fv==="fav"&&fav[b.id])||(fv==="feita"&&feita[b.id])||(fv==="porfazer"&&!feita[b.id])));
 r.sort((a,b)=>ordemDe(a).localeCompare(ordemDe(b)));
 const lista=$("#lista"),menu=$("#menu");lista.textContent="";menu.textContent="";
 $("#cont").textContent=r.length+" de "+BOLSAS.length+" bolsas";
 if(!r.length)lista.append(el("p","vazio","Nenhuma bolsa encontrada. Tenta outra palavra ou toca em Limpar."));
 const ks=meses().map(k=>[k,rotuloMes(k)]).concat([["confirmar","Prazo a confirmar"],["fechada","Já fechadas"]]);
 ks.forEach(([k,nome],i)=>{
  const g=r.filter(b=>chave(b)===k);
  if(!g.length&&i>=3)return;
  const s=el("section");s.id="s"+i;const h=el("h2",0,nome);h.append(el("small",0,String(g.length)));s.append(h);
  if(!g.length)s.append(el("p","vazio","Nenhuma bolsa com prazo conhecido neste mês."));
  g.forEach(b=>s.append(cartao(b,termos)));lista.append(s);
  const a=el("a",0,/^\d/.test(k)?cap(MESES[+k.slice(5)-1].slice(0,3))+" "+k.slice(2,4):nome);a.href="#s"+i;menu.append(a);
 });
}
function preencherPaises(){const sel=$("#fPais"),v=sel.value;sel.length=1;[...new Set(BOLSAS.map(b=>b.pais))].sort().forEach(p=>{const o=el("option",0,p);o.value=p;sel.append(o)});sel.value=v}
function carregarDados(){return new Promise((ok,erro)=>{const s=document.createElement("script");s.src="bolsas.js?t="+Date.now();s.onload=()=>{s.remove();ok()};s.onerror=()=>{s.remove();erro()};document.head.append(s)})}
async function atualizar(){
 const b=$("#atualizar"),e=$("#estado");b.disabled=true;e.textContent="A verificar a lista publicada...";
 const antes=new Set(BOLSAS.map(x=>x.id));
 try{
  await carregarDados();BOLSAS=DADOS.bolsas;ATUAL=DADOS.atualizado;
  const novos=BOLSAS.filter(x=>!antes.has(x.id));
  novos.forEach(x=>{novas[x.id]=true;vistas[x.id]=true});gravar("novas",novas);gravar("vistas",vistas);
  e.textContent=novos.length?(novos.length===1?"1 bolsa nova encontrada: ":novos.length+" bolsas novas encontradas: ")+novos.map(x=>x.nome).join("; ")+".":"Nenhuma bolsa nova. Lista de "+extenso(new Date(ATUAL+"T00:00:00"))+".";
  preencherPaises();resumo();destaque();desenhar();
  if("serviceWorker" in navigator)navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{});
 }catch(x){e.textContent="Sem ligação ao ficheiro da lista. A mostrar a última lista guardada."}
 b.disabled=false;
}
preencherPaises();
["#q","#fCob","#fPais","#fFav"].forEach(s=>$(s).addEventListener("input",desenhar));
$("#limpar").onclick=()=>{$("#q").value="";["#fCob","#fPais","#fFav"].forEach(s=>$(s).value="");desenhar()};
$("#atualizar").onclick=atualizar;
$("#estado").textContent="Lista de "+extenso(new Date(ATUAL+"T00:00:00"))+".";
$("#rod").textContent="Cada bolsa mostra a página consultada e a data de verificação. Novos editais aparecem em ibe.gov.mz.";
resumo();destaque();desenhar();
// Tema claro e escuro
const escuro=()=>matchMedia("(prefers-color-scheme: dark)").matches;
const efetivo=()=>document.documentElement.dataset.theme||(escuro()?"dark":"light");
function pintarTema(){const e=efetivo();$("#tema").textContent=e==="dark"?"Modo claro":"Modo escuro";const m=document.querySelector('meta[name=theme-color]');if(m)m.content=e==="dark"?"#12354f":"#bfe0f7"}
$("#tema").onclick=()=>{const n=efetivo()==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("tema",n)}catch(e){}pintarTema()};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",pintarTema);pintarTema();</script></body></html>
